<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="PsyFart Designer">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Notes | F4RT">
  <meta property="og:description" content="PsyFart Designer">
  <meta property="og:url" content="https://iamtew.github.io/F4RT/notes.html">
  <meta property="og:image" content="https://iamtew.github.io/F4RT/ogimage-F4RT.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://iamtew.github.io/F4RT/ogimage-F4RT.png">
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-note>
  <canvas id="fx" aria-hidden="true"></canvas>
  <header>
    <a class="brand" href="index.html"><img src="logo.png" alt="" width="36" height="36">F4RT</a>
    <nav>
      <a href="index.html#sound">Sound</a>
      <a href="index.html#about">About</a>
      <a href="notes.html?doc=MANUAL.md">Manual</a>
      <a href="index.html#notes">Notes</a>
      <a href="https://audio.stupid.systems/">Stupid Audio</a>
    </nav>
  </header>

  <main>
    <p class="meta"><a href="index.html#notes">← Notes</a></p>
    <article id="md" class="md card"></article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
  <script type="module" src="fx.js"></script>
  <script src="site.js"></script>
  <script>
    const allow = {
      "MANUAL.md": "Manual",
      "PRD.md": "Brief",
      "ARCHITECTURE.md": "Architecture",
      "DSP_NOTES.md": "DSP notes"
    };
    const file = new URLSearchParams(location.search).get("doc");
    const doc = allow[file] ? file : "PRD.md";
    document.title = allow[doc] + " | F4RT";
    fetch(doc)
      .then((r) => r.ok ? r.text() : Promise.reject())
      .then((t) => { document.getElementById("md").innerHTML = marked.parse(t); })
      .catch(() => { document.getElementById("md").textContent = "Could not load that note."; });
  </script>
</body>
</html>
